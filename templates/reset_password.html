<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>ΤΕΦΤΕΡΙ | Reset Password</title>
<link href="/static/styless.css" rel="stylesheet">

</head>
<body>

<div class="auth-shell">

  <div class="brand-panel">
    <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="Λογότυπο">
    <h1>ΤΕΦΤΕΡΙ</h1>
    <p>The leading platform for stock management & monitoring</p>
  </div>

  <div class="form-panel">

    <div id="resetBlock">
      <h2 class="page-title">Set a New Password</h2>
      <p class="page-sub">Choose a new password for your account.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error-msg" style="display:block;">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form id="resetForm" class="active" action="/reset-password" method="POST" onsubmit="return checkPasswordsMatch();">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" placeholder="••••••••" name="password" minlength="8" required>
            <button type="button" class="toggle-pass" onclick="togglePassword('newPassword', this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            </svg></button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" placeholder="••••••••" name="confirm_password" minlength="8" required>
            <button type="button" class="toggle-pass" onclick="togglePassword('confirmPassword', this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            </svg></button>
          </div>
          <p class="field-hint" id="matchHint" style="display:none; color:#c0392b; font-size:0.85em;">Passwords do not match.</p>
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
      </form>

    </div>

  </div>
</div>

<script>
  const eyeOpenSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
  <circle cx="12" cy="12" r="3"/>
</svg>`;

  const eyeClosedSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
  <circle cx="12" cy="12" r="3"/>
  <line x1="2" y1="2" x2="22" y2="22"/>
</svg>`;

  function togglePassword(fieldId, btn){
    const input = document.getElementById(fieldId);
    if(input.type === 'password'){
      input.type = 'text';
      btn.innerHTML = eyeClosedSVG;
    } else {
      input.type = 'password';
      btn.innerHTML = eyeOpenSVG;
    }
  }

  function checkPasswordsMatch(){
    const pw = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const hint = document.getElementById('matchHint');

    if(pw !== confirm){
      hint.style.display = 'block';
      return false;
    }

    hint.style.display = 'none';
    return true;
  }
</script>

</body>
</html>
